name: aeromonitor

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  restart: unless-stopped
  init: true

services:
  kafka:
    image: apache/kafka:4.1.2
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in aircraft.positions aircraft.alerts aircraft.derived aircraft.collections; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 --config retention.ms=604800000
        done

  producer:
    <<: *app
    command: [producer]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CONTROL_DATABASE_PATH: /app/control/control.db
    volumes:
      - control-data:/app/control

  processor:
    <<: *app
    command: [processor]

  alerts:
    <<: *app
    command: [alerts]
    volumes:
      - alerts-data:/app/data

  visualization:
    <<: *app
    command: [visualization]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      DATABASE_PATH: /app/data/dashboard.db
    volumes:
      - dashboard-data:/app/data

  dashboard:
    <<: *app
    entrypoint: [/app/.venv/bin/streamlit]
    command: [run, src/aeromonitor/dashboard.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false]
    environment:
      DATABASE_PATH: /app/data/dashboard.db
      CONTROL_DATABASE_PATH: /app/control/control.db
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      visualization:
        condition: service_started
    volumes:
      - dashboard-data:/app/data
      - control-data:/app/control

volumes:
  kafka-data:
  alerts-data:
  dashboard-data:
  control-data:
