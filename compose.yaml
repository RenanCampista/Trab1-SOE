name: aeromonitor

x-app: &app
  build: .
  env_file:
    - path: .env
      required: false
  environment:
    # Os clientes recebem os dois brokers como bootstrap; depois usam os metadados
    # do cluster para falar diretamente com o líder de cada partição.
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092,kafka-2:19092
  depends_on:
    kafka-init:
      condition: service_completed_successfully
  restart: unless-stopped
  init: true

x-kafka-common: &kafka-common
  image: apache/kafka:4.1.2
  restart: unless-stopped
  environment: &kafka-common-env
    CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_DIRS: /var/lib/kafka/data

services:
  # Broker 1 também executa o único controller KRaft.
  # O segundo broker replica dados.
  kafka:
    <<: *kafka-common
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
    volumes:
      - kafka-data-1:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 25s

  kafka-2:
    <<: *kafka-common
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:19092,EXTERNAL://localhost:9094
    volumes:
      - kafka-data-2:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 25s

  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        BOOTSTRAP="kafka:19092,kafka-2:19092"
        for topic in aircraft.positions aircraft.alerts aircraft.derived aircraft.collections; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server "$$BOOTSTRAP" \
            --create --if-not-exists \
            --topic "$$topic" \
            --partitions 3 \
            --replication-factor 2 \
            --config retention.ms=604800000
        done
        echo "Tópicos prontos (3 partições, replication factor 2):"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BOOTSTRAP" --describe

  producer:
    <<: *app
    command: [producer]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092,kafka-2:19092
      CONTROL_DATABASE_PATH: /app/control/control.db
    volumes:
      - control-data:/app/control

  # Duas instâncias no MESMO consumer group. Com 3 partições, Kafka distribui
  # as partições entre elas e demonstra consumo paralelo do grupo.
  processor:
    <<: *app
    command: [processor]

  processor-2:
    <<: *app
    command: [processor]

  alerts:
    <<: *app
    command: [alerts]
    volumes:
      - alerts-data:/app/data

  visualization:
    <<: *app
    command: [visualization]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092,kafka-2:19092
      DATABASE_PATH: /app/data/dashboard.db
    volumes:
      - dashboard-data:/app/data

  dashboard:
    <<: *app
    entrypoint: [/app/.venv/bin/streamlit]
    command: [run, src/aeromonitor/dashboard.py, --server.address=0.0.0.0, --server.port=8501, --server.headless=true, --browser.gatherUsageStats=false]
    environment:
      DATABASE_PATH: /app/data/dashboard.db
      CONTROL_DATABASE_PATH: /app/control/control.db
    ports:
      # Seguro por padrão no notebook local. Em uma VM/VPS, defina
      # DASHBOARD_BIND_ADDRESS=0.0.0.0 no .env para acesso remoto.
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:8501:8501"
    depends_on:
      visualization:
        condition: service_started
    volumes:
      - dashboard-data:/app/data
      - control-data:/app/control

volumes:
  kafka-data-1:
  kafka-data-2:
  alerts-data:
  dashboard-data:
  control-data:
