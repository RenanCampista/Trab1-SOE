[project]
name = "aeromonitor"
version = "0.1.0"
description = "Monitoramento de aeronaves com OpenSky, Kafka e Python"
requires-python = ">=3.12"
dependencies = [
  "confluent-kafka>=2.10,<3",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.9,<3",
  "streamlit>=1.50,<2",
  "pydeck>=0.9,<1",
  "tzdata>=2025.1",
]

[project.scripts]
aeromonitor = "aeromonitor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
